<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ArcGIS Maps SDK for JavaScript Tutorials: Display a map using arcgis/map-components</title>

  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
  </style>
 <script type="module" src="https://jsdev.arcgis.com/embeddable-components/4.33/arcgis-embeddable-components.esm.js"></script>
</head>


<body>
<arcgis-embedded-map style="height:200px;width:200px;" item-id="87560846c1b8499bbdeeb2df5286cb0a" calcite-script-override="https://cdn.jsdelivr.net/npm/@esri/calcite-components@3.2.0-next.17/dist/calcite/calcite.esm.min.js"
calcite-style-override="https://cdn.jsdelivr.net/npm/@esri/calcite-components@3.2.0-next.17/dist/calcite/calcite.min.css"
heading-enabled
host="jsdev"  theme="light" portal-url="https://arcgis.com" information-enabled></arcgis-embedded-map>
      
<arcgis-embedded-map style="height:600px;width:700px;" item-id="cf35269c59cd45cc9bfae3480c0a64d7" calcite-script-override="https://cdn.jsdelivr.net/npm/@esri/calcite-components@3.2.0-next.17/dist/calcite/calcite.esm.min.js"
calcite-style-override="https://cdn.jsdelivr.net/npm/@esri/calcite-components@3.2.0-next.17/dist/calcite/calcite.min.css"
heading-enabled
host="jsdev"  theme="light" heading-enabled information-enabled portal-url="https://jsapi.maps.arcgis.com" ></arcgis-embedded-map>
</body>


</html>
