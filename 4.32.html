<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Map components</title>
  <link rel="icon" href="data:;base64,=" />

  <style>
    html, body {
      background-color: var(--calcite-ui-foreground-2);
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      background-color: #2b2b2b;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .map-container {
      height: 80%;
      width: 80%;
    }
  </style>
  <!-- Load the ArcGIS Maps SDK for JavaScript -->

<!-- Add script to the <head> of your page to load the embeddable map component -->
    <script type="module" src="https://js.arcgis.com/embeddable-components/4.32/arcgis-embeddable-components.esm.js"></script>
</head>

<body>
  <header>
    <h1>Welcome to my site</h1>
  </header>
  <main>
    <div class="map-container">
        <arcgis-embedded-map style="height:600px;width:100%;" item-id="001834c3c4854731a92fa847a50c2d89" theme="dark"fullscreen-disabled
            bookmarks-enabled heading-enabled legend-enabled information-enabled portal-url="https://jsapi.maps.arcgis.com" >
    
       
     </arcgis-embedded-map>
    </div>
  </main>
  <footer>
    <p>My website name</p>
  </footer>
</body>
</html>
